<script src="https://cdn.tailwindcss.com"></script>

<script>
// Sofortiger Browser-Sprach-Redirect für unterstützte Sprachen.
// Falls Nutzer eine spezifische /de/ /en/ /fr/ /es/ URL bereits aufruft, kommt diese Datei nicht zum Einsatz.
(function() {
  try {
    const supported = ['de', 'en', 'fr', 'es'];
    // Check ?lang= override first
    const params = new URLSearchParams(location.search);
    let pick = params.get('lang');
    if (!pick) {
      // localStorage Präferenz
      try { pick = localStorage.getItem('wm2026-lang'); } catch (e) {}
    }
    if (!pick) {
      // Browser-Sprache
      const navLang = (navigator.languages?.[0] || navigator.language || 'en').toLowerCase().slice(0, 2);
      pick = navLang;
    }
    if (!supported.includes(pick)) pick = 'en';
    // Nur redirecten wenn JS verfügbar und kein "no-redirect"-Flag
    if (!params.has('noredirect')) {
      location.replace('/' + pick + '/');
    }
  } catch (e) { /* fallback: zeige Auswahl */ }
})();
</script>
</head>
