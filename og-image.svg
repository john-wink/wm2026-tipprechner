<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft accent stripe -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#logo)"/>

  <!-- Logo -->
  <rect x="100" y="100" width="120" height="120" rx="24" fill="url(#logo)"/>
  <text x="160" y="195" font-family="Helvetica, Arial, sans-serif" font-size="80" font-weight="700" fill="#fff" text-anchor="middle">⚽</text>

  <!-- Title -->
  <text x="100" y="320" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e6edf3">World Cup 2026</text>
  <text x="100" y="395" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="600" fill="#e6edf3">Prediction Optimizer</text>

  <!-- Subtitle -->
  <text x="100" y="455" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#7d8590">Aggregate 40+ bookmakers · Poisson model · Free</text>

  <!-- Languages -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="100" y="510" width="80" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="140" y="540" fill="#e6edf3" text-anchor="middle">DE</text>
    <rect x="190" y="510" width="80" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="230" y="540" fill="#e6edf3" text-anchor="middle">EN</text>
    <rect x="280" y="510" width="80" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="320" y="540" fill="#e6edf3" text-anchor="middle">FR</text>
    <rect x="370" y="510" width="80" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="410" y="540" fill="#e6edf3" text-anchor="middle">ES</text>
  </g>

  <!-- Right corner: stats illustration -->
  <g transform="translate(820, 150)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#7d8590">Example match</text>
    <text y="50" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#e6edf3">🇪🇸 Spain vs France 🇫🇷</text>

    <text y="120" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7d8590">Optimal pick</text>
    <text y="170" font-family="ui-monospace, monospace" font-size="72" font-weight="700" fill="#3fb950">2:1</text>
    <text y="210" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#7d8590">EV 1.84 · 21 bookmakers</text>

    <!-- Mini probability bar -->
    <rect x="0" y="240" width="290" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
    <rect x="0" y="240" width="125" height="40" rx="6" fill="#2ea043"/>
    <rect x="125" y="240" width="80" height="40" fill="#484f58"/>
    <rect x="205" y="240" width="85" height="40" rx="6" fill="#58a6ff"/>
    <text x="62" y="265" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">43%</text>
    <text x="165" y="265" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">28%</text>
    <text x="247" y="265" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">29%</text>
  </g>
</svg>
